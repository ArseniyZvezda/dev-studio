id: plastic
name: Plastic SCM (Unity Version Control)
version: 0.1.0
author: Voxarium Studio
description: >
  Commits generated assets to Plastic SCM / Unity Version Control, and teaches the Studio
  to recognise a Plastic workspace at all — the plugin registers a version control
  backend (§10.5), so the project header and the team's task isolation see Plastic the
  same way they see git.

  Nodes: `plastic.checkin` (the commit node — takes the file an import node wrote and
  outputs the changeset), `plastic.add` and `plastic.status`.

  Needs the `cm` command line from the Unity Version Control client on PATH, or its
  absolute path set on the plugin's settings page. Checkins run with `--all` because a
  pipeline writes files without checking them out first.
enabled_by_default: true

backend:
  entry: plugin.py:register

frontend:
  pages:
    - id: plastic-settings
      title: Plastic SCM
      icon: git-branch
      route: /plugins/plastic/settings
      component: frontend/SettingsPage.js
  dist: frontend
