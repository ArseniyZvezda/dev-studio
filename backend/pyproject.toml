[project]
name = "voxarium_studio"
version = "5.0.0"
description = "Voxarium Studio вЂ” local web hub for AI game-dev pipelines, plugins and agent teams"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # Round-trip YAML for the team roster: it is meant to be read and committed (В§5), and
    # the sample ships with the comments that explain the format. safe_dump erases them
    # the first time the member editor writes the file back.
    "ruamel.yaml>=0.18",
    "watchfiles>=0.24",
    "httpx>=0.27",
    # The client end of online sync (§16). Already installed by uvicorn[standard], which
    # serves the Studio's own sockets with it; named here because sync imports it directly.
    "websockets>=13",
    "typer>=0.15",
    # Builds each plugin's isolated venv (В§2.1). Bundled so plugin installation works
    # out of the box rather than requiring a separate uv install.
    "uv>=0.5",
]

[project.optional-dependencies]
# The SDK ships its own Claude Code binary and always runs that one, never the `claude`
# on PATH вЂ” so the floor here is really a floor on Claude Code. Claude 5 model ids need
# Claude Code >= 2.1.251 and Opus 5.5 (`claude-opus-5-5`, and `opus` resolving to it) needs
# 2.1.280; 0.2.152 bundled 2.1.259 and 0.2.158 bundles 2.1.280 (В§10.3).
teams = ["claude-agent-sdk>=0.2.158", "mcp>=1.0,<2"]
# pytest-xdist is not optional in practice: `addopts` below runs the suite across every
# core, which is what takes it from minutes to seconds.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-xdist>=3.6"]

[project.scripts]
voxarium_studio = "voxarium_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voxarium_studio"]
# The parent .gitignore's /voxarium_studio/ is managed-project data, but Hatch
# applies it relative to backend/ and would drop the entire Python package.
# Select the package explicitly, including the generated SPA required by §2.7.
ignore-vcs = true
exclude = ["**/__pycache__", "*.py[cod]", "/voxarium_studio/_build_stamp.json"]

# Writes voxarium_studio/_build_stamp.json into the wheel, so an installed Studio can still say
# which commit it came from вЂ” see hatch_build.py and voxarium_studio/build_info.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The built SPA lands in voxarium_studio/static (see frontend/vite.config.ts `outDir`), so it
# ships inside the package and is served by the same process as the API.
[tool.hatch.build.targets.wheel.force-include]
"plugins_builtin" = "voxarium_studio/plugins_builtin"
# The changelog lives at the repository root, where a changelog belongs. A copy travels
# inside the package for the same reason the build stamp does: an installed Studio has no
# checkout to read it from, and `GET /api/changelog` still has to answer (build_info.py).
"../CHANGELOG.md" = "voxarium_studio/CHANGELOG.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Every test owns a `tmp_path` project and the machine-level directory is redirected per
# worker, so there is nothing for workers to share and nothing to serialise. Add `-n0` to
# turn it off вЂ” worth it for one small file (the workers cost ~3s to start, which a file
# under ~30 tests never earns back) and required for `--pdb`, which xdist cannot run.
addopts = ["-n", "auto"]
markers = [
    "real_vcs: let this test probe the machine for version control instead of being told there is none (see tests/conftest.py)",
    "real_updates: let this test arm the update checker against the Studio's own remote (see tests/conftest.py)",
    "real_graphify: let this test find the graphify CLI on the machine instead of being told it is absent (see tests/conftest.py)",
]
